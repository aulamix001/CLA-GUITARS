name: Windows x64 VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build plugin and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $errors = Get-Content build.log | Select-String -Pattern 'error [A-Z]+[0-9]+|fatal error|error:|Error [A-Z]+[0-9]+' | Select-Object -First 15
            foreach ($line in $errors) { Write-Output "::error::$line" }
            exit $result
          }
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $plugin = 'build/CLAInspiredGuitar_artefacts/Release/VST3/Guitar Rack.vst3'
          if (!(Test-Path "$plugin/Contents/x86_64-win/Guitar Rack.vst3")) {
            throw 'Windows x64 VST3 binary missing'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          if ((Get-ChildItem Presets -Recurse -Filter *.xml).Count -ne 60) {
            throw 'Expected 60 exported factory presets'
          }
          Compress-Archive -Path $plugin, 'Presets', 'presets.csv', 'docs/INSTALL-Windows.txt' -DestinationPath 'dist/Guitar-Rack-Windows-x64-VST3.zip'
          Get-FileHash 'dist/Guitar-Rack-Windows-x64-VST3.zip' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Guitar-Rack-Windows-x64-VST3
          path: dist/Guitar-Rack-Windows-x64-VST3.zip
          if-no-files-found: error
